<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="725" viewBox="0 0 1250 725"
     font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <title>RM_Infantry 整车电源树（第一版）</title>
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#991b1b"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1250" height="725" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="40" y="46" font-size="24" font-weight="bold" fill="#0f172a">整车电源树（第一版）</text>
  <text x="40" y="72" font-size="13" fill="#64748b">一块电池在底盘，电源和 CAN 都走滑环（XT：5 根细线并联；另有 CANH、CANL）。按用户 2026-11-11 说的链路画；云台这头怎么分、5 根线几正几负以实物为准。</text>

  <!-- 区域 -->
  <rect x="30" y="95" width="765" height="400" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="50" y="126" font-size="18" font-weight="bold" fill="#334155">底盘</text>

  <rect x="810" y="95" width="50" height="400" rx="10" fill="#fef9c3" stroke="#eab308"/>
  <text x="835" y="128" font-size="15" font-weight="bold" fill="#854d0e" text-anchor="middle">滑</text>
  <text x="835" y="148" font-size="15" font-weight="bold" fill="#854d0e" text-anchor="middle">环</text>

  <rect x="870" y="95" width="355" height="400" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-dasharray="6 4"/>
  <text x="890" y="126" font-size="18" font-weight="bold" fill="#6b21a8">云台</text>

  <!-- ===== 主链路：电池 → 3508 分电板 → F405 → 总线分电板 → 滑环 → 云台 ===== -->
  <line x1="175" y1="205" x2="217" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="350" y1="205" x2="392" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="371" y="196" font-size="11" fill="#b91c1c" text-anchor="middle">XT30</text>
  <line x1="565" y1="205" x2="607" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="586" y="196" font-size="11" fill="#b91c1c" text-anchor="middle">XT30</text>
  <line x1="780" y1="205" x2="950" y2="205" stroke="#dc2626" stroke-width="3"/>
  <circle cx="950" cy="205" r="4.5" fill="#dc2626"/>
  <line x1="950" y1="205" x2="1037" y2="205" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <line x1="950" y1="205" x2="950" y2="327" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>

  <rect x="45" y="170" width="130" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="200" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">底盘电池</text>
  <text x="110" y="222" font-size="12" fill="#991b1b" text-anchor="middle">24 V，整车就这一块</text>

  <rect x="220" y="170" width="130" height="70" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="285" y="200" font-size="14" font-weight="bold" fill="#713f12" text-anchor="middle">3508 分电板</text>
  <text x="285" y="222" font-size="12" fill="#334155" text-anchor="middle">电池先到这里</text>

  <rect x="395" y="170" width="170" height="70" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="480" y="200" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">F405 底盘主控板</text>
  <text x="480" y="222" font-size="12" fill="#334155" text-anchor="middle">板上 24 V → 5 V → 3.3 V</text>
  <text x="480" y="264" font-size="12" fill="#b91c1c" text-anchor="middle">给云台、yaw 的电都从这块板穿过去</text>
  <text x="480" y="283" font-size="12" fill="#b91c1c" text-anchor="middle">（XT30 ×3 并联，一进一出；没有保险丝）</text>

  <rect x="610" y="170" width="170" height="70" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="2"/>
  <text x="695" y="200" font-size="13" font-weight="bold" fill="#713f12" text-anchor="middle">CAN2 / RS05 总线分电板</text>
  <text x="695" y="222" font-size="12" fill="#334155" text-anchor="middle">F405 CAN2 + yaw RS05</text>

  <!-- 滑环里 -->
  <text x="835" y="228" font-size="11" fill="#b91c1c" text-anchor="middle">XT</text>
  <text x="835" y="243" font-size="11" fill="#b91c1c" text-anchor="middle">5 根</text>
  <text x="835" y="258" font-size="11" fill="#b91c1c" text-anchor="middle">细线</text>
  <text x="835" y="300" font-size="10" fill="#6d28d9" text-anchor="middle">CANH</text>
  <text x="835" y="314" font-size="10" fill="#6d28d9" text-anchor="middle">CANL</text>

  <!-- ===== 底盘的分支 ===== -->
  <line x1="285" y1="240" x2="285" y2="327" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <rect x="220" y="330" width="130" height="50" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="285" y="361" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">C620 ×4</text>
  <line x1="285" y1="380" x2="285" y2="427" stroke="#991b1b" stroke-width="2" marker-end="url(#arrDark)"/>
  <text x="293" y="410" font-size="11" fill="#64748b">三相</text>
  <rect x="220" y="430" width="130" height="46" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="285" y="458" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">M3508 ×4</text>

  <line x1="695" y1="240" x2="695" y2="327" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRed)"/>
  <rect x="620" y="330" width="150" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="695" y="354" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">yaw RS05</text>
  <text x="695" y="376" font-size="12" fill="#334155" text-anchor="middle">XT30(2+2)：电源 + CAN</text>

  <!-- ===== 云台 ===== -->
  <rect x="1040" y="170" width="170" height="70" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
  <text x="1125" y="200" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">C 板 云台主控</text>
  <text x="1125" y="222" font-size="12" fill="#334155" text-anchor="middle">板上 24 V → 5 V → 3.3 V</text>

  <text x="958" y="262" font-size="11" fill="#64748b">云台这头怎么分，以实物为准</text>

  <rect x="875" y="330" width="150" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="950" y="354" font-size="14" font-weight="bold" fill="#7c2d12" text-anchor="middle">pitch RS05</text>
  <text x="950" y="376" font-size="12" fill="#334155" text-anchor="middle">XT30(2+2)：电源 + CAN</text>

  <line x1="1125" y1="240" x2="1125" y2="327" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <text x="1117" y="300" font-size="11" fill="#1d4ed8" text-anchor="end">5 V（DBUS 口）</text>
  <rect x="1055" y="330" width="140" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1125" y="354" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">DR16 接收机</text>
  <text x="1125" y="374" font-size="12" fill="#334155" text-anchor="middle">装在云台上</text>

  <!-- ===== 注意 ===== -->
  <rect x="30" y="515" width="1195" height="172" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="50" y="541" font-size="14" font-weight="bold" fill="#9a3412">注意</text>
  <text x="50" y="567" font-size="13" fill="#431407">1. 给云台和 yaw RS05 的电都穿过 F405 的 XT30 和板上铜皮，F405 没有保险丝、没有防反接。保险丝加在滑环之前（比如总线分电板引去滑环那一路），云台那边短路时先断它。</text>
  <text x="50" y="591" font-size="13" fill="#431407">2. 5 根细线是正负一起算的：负极电流和正极一样大，能过多少按根数少的那边算；每根的额定电流看滑环规格书，并联的几根分流不均，按总额定打七折左右。</text>
  <text x="50" y="615" font-size="13" fill="#431407">3. 电源走滑环以后两边靠电源负极共地，不用再单独走 GND；以前上下两块电池时那根单独的 GND 线不要了。</text>
  <text x="50" y="639" font-size="13" fill="#431407">4. 只接 DAPLink 时 CAN 不能用（收发器没有 5 V）；F405 只插 USB 不上电（VBUS 没接）；C 板只插 USB 时 DBUS 口没电（用的是 24 V 降出来的那路 5 V）。</text>
  <text x="50" y="663" font-size="13" fill="#431407">5. 以后加发射机构（两个摩擦轮起转、拨盘）电流大得多，这个细滑环多半带不动；比赛时电源管理模块的云台口、发射机构口都要经滑环送上去。</text>

  <!-- 图例 -->
  <line x1="40" y1="706" x2="80" y2="706" stroke="#dc2626" stroke-width="3"/>
  <text x="88" y="710" font-size="12" fill="#334155">24 V（电池电压）</text>
  <line x1="215" y1="706" x2="255" y2="706" stroke="#2563eb" stroke-width="2.5"/>
  <text x="263" y="710" font-size="12" fill="#334155">5 V</text>
  <text x="320" y="710" font-size="12" fill="#334155">箭头：供电方向</text>
</svg>
